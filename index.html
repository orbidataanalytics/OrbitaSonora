<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órbita Sonora | ORBIDATA</title>
    <!-- Fuentes oficiales: Orbitron (Futurista), Pacifico (Retro Jukebox), Poppins (Texto) -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            /* Fondo astronómico de la Tierra desde el espacio */
            background: radial-gradient(circle at center, rgba(10, 15, 30, 0.4) 0%, rgba(5, 8, 18, 0.85) 100%),
                        url('https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* --- LOGO SUPERIOR: ORBIDATA --- */
        header {
            width: 100%;
            padding: 25px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .orbidata-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.8), 0 0 25px rgba(0, 240, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 24px;
            border-radius: 50px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .orbidata-logo span {
            color: #00f0ff;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: 10px 0 50px;
            z-index: 5;
            width: 100%;
            max-width: 900px;
        }

        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(180deg, #ffffff 0%, #a5f3fc 50%, #00d8f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 216, 246, 0.5);
            margin-bottom: 25px;
        }

        /* --- ROCOLA VINTAGE (Jukebox CSS) --- */
        .jukebox-container {
            position: relative;
            width: 320px;
            height: 480px;
            background: linear-gradient(145deg, #2b0938, #12031c);
            border-radius: 160px 160px 20px 20px;
            border: 6px solid #ffd700;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.4), 
                        0 0 60px rgba(255, 0, 128, 0.3),
                        inset 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 25px;
            transition: transform 0.3s ease;
        }

        .jukebox-container:hover {
            transform: scale(1.02);
        }

        /* Arco Neón Exterior Animado */
        .jukebox-arch {
            position: absolute;
            top: 10px;
            width: 280px;
            height: 140px;
            border-radius: 140px 140px 0 0;
            border: 4px solid #ff007f;
            box-shadow: 0 0 15px #ff007f, inset 0 0 15px #ff007f;
            animation: neonGlow 2s infinite alternate;
        }

        @keyframes neonGlow {
            0% { box-shadow: 0 0 12px #ff007f, inset 0 0 12px #ff007f; }
            100% { box-shadow: 0 0 25px #00f0ff, inset 0 0 25px #00f0ff; border-color: #00f0ff; }
        }

        /* Ventana del Vinilo */
        .jukebox-window {
            width: 220px;
            height: 150px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 110px 110px 15px 15px;
            border: 3px solid #ffd700;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Disco de Vinilo Giratorio */
        .vinyl-record {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, #333 15%, #111 16%, #111 30%, #222 31%, #111 45%, #ffd700 46%, #ff007f 100%);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .vinyl-center {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #ffffff;
            border-radius: 50%;
        }

        /* Pantalla digital de la Rocola */
        .jukebox-display {
            width: 240px;
            background: #0d1b2a;
            border: 2px solid #00f0ff;
            border-radius: 8px;
            margin-top: 20px;
            padding: 8px 12px;
            font-family: 'Orbitron', monospace;
            font-size: 0.75rem;
            color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            text-shadow: 0 0 5px #00f0ff;
        }

        /* Rejilla de Altavoz */
        .jukebox-speaker {
            width: 240px;
            height: 140px;
            margin-top: 15px;
            background: repeating-linear-gradient(
                0deg,
                #1a1a2e,
                #1a1a2e 4px,
                #ffd700 5px,
                #1a1a2e 6px
            );
            border-radius: 10px;
            border: 3px solid #ffd700;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .jukebox-title-badge {
            font-family: 'Pacifico', cursive;
            font-size: 1.5rem;
            color: #ffd700;
            text-shadow: 2px 2px 4px #000;
            background: rgba(0,0,0,0.6);
            padding: 4px 15px;
            border-radius: 20px;
            border: 1px solid #ffd700;
        }

        /* Botones Interactivos Retro */
        .jukebox-buttons {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .btn-retro {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: radial-gradient(circle, #ff007f, #880044);
            box-shadow: 0 0 8px #ff007f;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .btn-retro:nth-child(2) { background: radial-gradient(circle, #00f0ff, #006688); box-shadow: 0 0 8px #00f0ff; }
        .btn-retro:nth-child(3) { background: radial-gradient(circle, #ffd700, #998000); box-shadow: 0 0 8px #ffd700; }

        .btn-retro:active {
            transform: scale(0.9);
        }

        /* --- LOGO NASA FIJO (Abajo a la Izquierda) --- */
        .nasa-fixed-logo {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(11, 19, 43, 0.75);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .nasa-fixed-logo:hover {
            transform: translateY(-3px);
        }

        .nasa-fixed-logo img {
            width: 38px;
            height: auto;
        }

        .nasa-fixed-logo span {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #e2e8f0;
        }

        @media (max-width: 600px) {
            .main-title { font-size: 2.2rem; }
            .jukebox-container { scale: 0.85; }
        }
    </style>
</head>
<body>

    <!-- 1. Logo Superior ORBIDATA -->
    <header>
        <div class="orbidata-logo">
            <span>ORBI</span>DATA
        </div>
    </header>

    <!-- 2. Contenido Principal: Título y Rocola -->
    <main>
        <h1 class="main-title">Órbita Sonora</h1>

        <div class="jukebox-container">
            <div class="jukebox-arch"></div>
            
            <div class="jukebox-window">
                <div class="vinyl-record"></div>
                <div class="vinyl-center"></div>
            </div>

            <div class="jukebox-display" id="api-status">
                ▶ Pista 01: Sonidos del Espacio (NASA)
            </div>

            <div class="jukebox-speaker">
                <span class="jukebox-title-badge">Rock & Space</span>
            </div>

            <div class="jukebox-buttons">
                <button class="btn-retro" onclick="cambiarPista('Sonidos de Júpiter')" title="Pista 1"></button>
                <button class="btn-retro" onclick="conectarAPI()" title="Conectar con FastAPI en Render"></button>
                <button class="btn-retro" onclick="cambiarPista('Ondas de Radio Terrestres')" title="Pista 3"></button>
            </div>
        </div>
    </main>

    <!-- 3. Logo NASA Siempre Visible (Abajo Izquierda) -->
    <div class="nasa-fixed-logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e5/NASA_logo.svg" alt="NASA Logo">
        <span>NASA Partner Data</span>
    </div>

    <!-- Script de interacción con Render -->
    <script>
        function cambiarPista(nombre) {
            document.getElementById('api-status').innerText = "▶ Reproduciendo: " + nombre;
        }

        async function conectarAPI() {
            const statusDiv = document.getElementById('api-status');
            statusDiv.innerText = "⚡ Conectando a FastAPI...";
            
            // COPIA Y PEGA AQUÍ LA URL DE TU SERVICIO EN RENDER:
            const RENDER_URL = 'https://TU-SERVICIO-EN-RENDER.onrender.com/api/datos';

            try {
                const response = await fetch(RENDER_URL);
                const data = await response.json();
                statusDiv.innerText = "📡 API: " + data.planeta + " | Estado: " + data.estado;
            } catch (error) {
                statusDiv.innerText = "▶ Pista 02: Órbita Terrestre (Modo Demo)";
            }
        }
    </script>
</body>
</html>
