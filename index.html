<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órbita Sonora | ORBIDATA</title>
    <!-- Fuentes: Orbitron, Pacifico, Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            background-color: #03050a;
            /* Fondo dinámico del satélite GOES-16 centrado en Suramérica */
            background-image: radial-gradient(circle at center, rgba(10, 15, 30, 0.25) 0%, rgba(3, 5, 10, 0.88) 100%),
                        url('https://cdn.star.nesdis.noaa.gov/GOES16/ABI/FD/GEOCOLOR/1808x1808.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
            transition: background-image 1.2s ease-in-out;
        }

        /* Contenedor técnico de YouTube en coordenadas negativas (evita bloqueos de autoplay) */
        #yt-player-container {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* --- LOGO SUPERIOR ORBIDATA --- */
        header {
            width: 100%;
            padding: 25px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .orbidata-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.8), 0 0 25px rgba(0, 240, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(10, 15, 30, 0.7);
            padding: 8px 24px;
            border-radius: 50px;
            border: 1px solid rgba(0, 240, 255, 0.4);
            backdrop-filter: blur(12px);
        }

        .orbidata-logo span {
            color: #00f0ff;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: 10px 0 40px;
            z-index: 5;
            width: 100%;
            max-width: 900px;
        }

        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(180deg, #ffffff 0%, #a5f3fc 50%, #00d8f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 216, 246, 0.6);
            margin-bottom: 25px;
        }

        /* --- ROCOLA VINTAGE --- */
        .jukebox-container {
            position: relative;
            width: 350px;
            min-height: 570px;
            background: linear-gradient(145deg, rgba(43, 9, 56, 0.95), rgba(18, 3, 28, 0.95));
            border-radius: 175px 175px 20px 20px;
            border: 6px solid #ffd700;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.4), 
                        0 0 60px rgba(0, 240, 255, 0.25),
                        inset 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 15px 20px;
            backdrop-filter: blur(8px);
            transition: transform 0.3s ease;
        }

        .jukebox-container:hover {
            transform: scale(1.02);
        }

        /* Arco Neón Exterior */
        .jukebox-arch {
            position: absolute;
            top: 10px;
            width: 310px;
            height: 155px;
            border-radius: 155px 155px 0 0;
            border: 4px solid #00f0ff;
            box-shadow: 0 0 15px #00f0ff, inset 0 0 15px #00f0ff;
            animation: neonGlow 3s infinite alternate;
        }

        @keyframes neonGlow {
            0% { box-shadow: 0 0 12px #00f0ff, inset 0 0 12px #00f0ff; border-color: #00f0ff; }
            50% { box-shadow: 0 0 20px #00e676, inset 0 0 20px #00e676; border-color: #00e676; }
            100% { box-shadow: 0 0 25px #ff334b, inset 0 0 25px #ff334b; border-color: #ff334b; }
        }

        /* Ventana del Vinilo */
        .jukebox-window {
            width: 230px;
            height: 135px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 115px 115px 15px 15px;
            border: 3px solid #ffd700;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Disco de Vinilo Giratorio */
        .vinyl-record {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, #333 15%, #111 16%, #111 30%, #222 31%, #111 45%, #ffd700 46%, #00f0ff 100%);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            animation: spin 4s linear infinite;
            animation-play-state: paused;
        }

        .vinyl-record.playing {
            animation-play-state: running;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .vinyl-center {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #ffffff;
            border-radius: 50%;
        }

        /* Pantalla Digital con Metadatos y Barra de Progreso */
        .jukebox-display {
            width: 290px;
            min-height: 115px;
            background: #08101d;
            border: 2px solid #00f0ff;
            border-radius: 8px;
            margin-top: 12px;
            padding: 10px 12px;
            font-family: 'Orbitron', monospace;
            color: #00f0ff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
            text-shadow: 0 0 5px #00f0ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
            gap: 4px;
        }

        .display-line {
            font-size: 0.68rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .display-title {
            color: #ffffff;
            font-weight: 700;
            font-size: 0.76rem;
        }

        .display-genre {
            color: #ffd700;
        }

        .display-author {
            color: #a5f3fc;
        }

        /* --- BARRA DE PROGRESO DE AUDIO --- */
        .progress-container {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .progress-bar-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .seek-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        .seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00f0ff;
            box-shadow: 0 0 8px #00f0ff;
            cursor: pointer;
        }

        .time-label {
            font-size: 0.62rem;
            color: #ffd700;
            text-align: right;
            letter-spacing: 1px;
        }

        /* Rejilla de Altavoz */
        .jukebox-speaker {
            width: 290px;
            height: 65px;
            margin-top: 10px;
            background: repeating-linear-gradient(
                0deg,
                #1a1a2e,
                #1a1a2e 4px,
                #ffd700 5px,
                #1a1a2e 6px
            );
            border-radius: 10px;
            border: 3px solid #ffd700;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .jukebox-title-badge {
            font-family: 'Pacifico', cursive;
            font-size: 1.2rem;
            color: #ffd700;
            text-shadow: 2px 2px 4px #000;
            background: rgba(0,0,0,0.8);
            padding: 3px 16px;
            border-radius: 20px;
            border: 1px solid #ffd700;
        }

        /* PANEL LISTA DESPLEGABLE (Botón Azul) */
        .playlist-panel {
            display: none;
            width: 290px;
            background: rgba(8, 16, 29, 0.95);
            border: 2px solid #40c4ff;
            border-radius: 8px;
            margin-top: 8px;
            padding: 8px;
            flex-direction: column;
            gap: 6px;
            z-index: 20;
            backdrop-filter: blur(10px);
        }

        .playlist-panel.active {
            display: flex;
        }

        .playlist-item {
            font-family: 'Orbitron', monospace;
            font-size: 0.68rem;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s, color 0.2s;
            color: #a5f3fc;
            user-select: none;
        }

        .playlist-item:hover, .playlist-item.selected {
            background: rgba(0, 240, 255, 0.2);
            color: #ffffff;
            border-left: 3px solid #00f0ff;
        }

        /* BOTONES INTERACTIVOS (🔴 Pausa, 🟢 Play, 🔵 Lista) */
        .jukebox-buttons {
            display: flex;
            gap: 15px;
            margin-top: 12px;
        }

        .btn-retro {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            color: #ffffff;
        }

        /* 🔴 Botón Rojo: Pausar */
        .btn-red {
            background: radial-gradient(circle at 30% 30%, #ff5252, #c62828);
            box-shadow: 0 0 12px #ff5252;
        }

        /* 🟢 Botón Verde: Reproducir */
        .btn-green {
            background: radial-gradient(circle at 30% 30%, #69f0ae, #2e7d32);
            box-shadow: 0 0 12px #69f0ae;
        }

        /* 🔵 Botón Azul: Abrir / Cerrar Lista de Canciones */
        .btn-blue {
            background: radial-gradient(circle at 30% 30%, #40c4ff, #1565c0);
            box-shadow: 0 0 12px #40c4ff;
        }

        .btn-retro:hover {
            transform: scale(1.12);
        }

        .btn-retro:active {
            transform: scale(0.92);
        }

        /* LOGO NASA FIJO */
        .nasa-fixed-logo {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(11, 19, 43, 0.85);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .nasa-fixed-logo img {
            width: 38px;
            height: auto;
        }

        .nasa-fixed-logo span {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #e2e8f0;
        }

        /* Indicador Satelital GOES-16 */
        .goes-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(11, 19, 43, 0.85);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            font-size: 0.72rem;
            color: #a5f3fc;
            backdrop-filter: blur(8px);
        }

        @media (max-width: 600px) {
            .main-title { font-size: 2.2rem; }
            .jukebox-container { scale: 0.88; }
            .goes-indicator { display: none; }
        }
    </style>
</head>
<body>

    <!-- 1. Logo Superior ORBIDATA -->
    <header>
        <div class="orbidata-logo">
            <span>ORBI</span>DATA
        </div>
    </header>

    <!-- 2. Contenido Principal -->
    <main>
        <h1 class="main-title">Órbita Sonora</h1>

        <div class="jukebox-container">
            <div class="jukebox-arch"></div>
            
            <div class="jukebox-window">
                <div class="vinyl-record" id="vinyl"></div>
                <div class="vinyl-center"></div>
            </div>

            <!-- Display Digital de la Rocola -->
            <div class="jukebox-display" id="display-screen">
                <div class="display-line display-title" id="track-title">🎵 Pista: End Of Line</div>
                <div class="display-line display-genre" id="track-genre">🎷 Género: Electronic / Cyberpunk</div>
                <div class="display-line display-author" id="track-author">👤 Autores: Daft Punk (TRON: Legacy)</div>

                <!-- Barra de Progreso y Tiempo Real -->
                <div class="progress-container">
                    <div class="progress-bar-wrapper">
                        <input type="range" class="seek-slider" id="seek-bar" min="0" max="100" value="0" oninput="cambiarTiempo(this.value)">
                    </div>
                    <div class="time-label" id="time-display">00:00 / 00:00</div>
                </div>
            </div>

            <!-- Panel Lista Desplegable (Activado con Botón Azul) -->
            <div class="playlist-panel" id="playlist-panel">
                <div class="playlist-item selected" onclick="seleccionarItem(0)" ondblclick="reproducirPistaDirecta(0)">1. End Of Line - Daft Punk</div>
                <div class="playlist-item" onclick="seleccionarItem(1)" ondblclick="reproducirPistaDirecta(1)">2. Derezzed - Daft Punk</div>
                <div class="playlist-item" onclick="seleccionarItem(2)" ondblclick="reproducirPistaDirecta(2)">3. The Son Of Flynn - Daft Punk</div>
            </div>

            <div class="jukebox-speaker">
                <span class="jukebox-title-badge">TRON Legacy</span>
            </div>

            <!-- Botones Interactivos: Rojo (Pausa), Verde (Play), Azul (Lista) -->
            <div class="jukebox-buttons">
                <button class="btn-retro btn-red" onclick="pausarAudio()" title="🔴 Rojo: Pausar Reproducción">⏸</button>
                <button class="btn-retro btn-green" onclick="reproducirAudio()" title="🟢 Verde: Reproducir Canción Seleccionada">▶</button>
                <button class="btn-retro btn-blue" onclick="togglePlaylist()" title="🔵 Azul: Abrir / Cerrar Lista de Canciones">📋</button>
            </div>
        </div>
    </main>

    <!-- Contenedor iframe de YouTube (Técnicamente activo pero fuera de la vista) -->
    <div id="yt-player-container"></div>

    <!-- 3. Logo NASA Fijo -->
    <div class="nasa-fixed-logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e5/NASA_logo.svg" alt="NASA Logo">
        <span>GOES-16 & NASA Open APIs</span>
    </div>

    <!-- Indicador Satelital NOAA GOES-16 -->
    <div class="goes-indicator" id="goes-timer">
        🛰️ GOES-16 (Suramérica en vivo)
    </div>

    <!-- API IFrame oficial de YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // Enlaces exactos proporcionados de YouTube (Daft Punk - TRON Legacy)
        const playlist = [
            {
                videoId: "x3gdLqoM6Ec",
                titulo: "End Of Line",
                album: "TRON: Legacy OST",
                autores: "Daft Punk",
                genero: "Electronic / Cyberpunk"
            },
            {
                videoId: "m4lkg-vdsgY",
                titulo: "Derezzed",
                album: "TRON: Legacy OST",
                autores: "Daft Punk",
                genero: "Electro House / Synthwave"
            },
            {
                videoId: "fsHz2DU7b7s",
                titulo: "The Son Of Flynn",
                album: "TRON: Legacy OST",
                autores: "Daft Punk",
                genero: "Ambient Synth / Electronic"
            }
        ];

        let pistaSeleccionada = 0;
        let pistaCargadaIndex = -1;
        let player = null;
        let timerProgreso = null;

        const vinyl = document.getElementById('vinyl');
        const seekBar = document.getElementById('seek-bar');
        const timeDisplay = document.getElementById('time-display');

        // Inicializar motor IFrame de YouTube
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player-container', {
                height: '200',
                width: '200',
                videoId: playlist[0].videoId,
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'playsinline': 1
                },
                events: {
                    'onReady': () => { actualizarPantalla(); },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                vinyl.classList.add('playing');
                iniciarRastreoTiempo();
            } else {
                vinyl.classList.remove('playing');
                detenerRastreoTiempo();
            }

            // Reproducción automática de la siguiente canción al finalizar
            if (event.data === YT.PlayerState.ENDED) {
                let siguiente = (pistaSeleccionada + 1) % playlist.length;
                reproducirPistaDirecta(siguiente);
            }
        }

        function formatearTiempo(segundos) {
            if (isNaN(segundos) || segundos < 0) return "00:00";
            const min = Math.floor(segundos / 60);
            const seg = Math.floor(segundos % 60);
            return `${min < 10 ? '0' : ''}${min}:${seg < 10 ? '0' : ''}${seg}`;
        }

        // Rastreador continuo de la barra de avance
        function iniciarRastreoTiempo() {
            detenerRastreoTiempo();
            timerProgreso = setInterval(() => {
                if (player && player.getCurrentTime && player.getDuration) {
                    const actual = player.getCurrentTime();
                    const total = player.getDuration();
                    if (total > 0) {
                        const porcentaje = (actual / total) * 100;
                        seekBar.value = porcentaje;
                        timeDisplay.innerText = `${formatearTiempo(actual)} / ${formatearTiempo(total)}`;
                    }
                }
            }, 500);
        }

        function detenerRastreoTiempo() {
            if (timerProgreso) clearInterval(timerProgreso);
        }

        // Permite saltar a cualquier punto de la canción en YouTube deslizando la barra
        function cambiarTiempo(valorPorcentaje) {
            if (player && player.getDuration) {
                const total = player.getDuration();
                const nuevoTiempo = (valorPorcentaje / 100) * total;
                player.seekTo(nuevoTiempo, true);
            }
        }

        function actualizarPantalla() {
            const track = playlist[pistaSeleccionada];
            document.getElementById('track-title').innerText = `🎵 Pista: ${track.titulo}`;
            document.getElementById('track-genre').innerText = `🎷 Género: ${track.genero}`;
            document.getElementById('track-author').innerText = `👤 Autores: ${track.autores}`;

            const items = document.querySelectorAll('.playlist-item');
            items.forEach((item, index) => {
                if (index === pistaSeleccionada) item.classList.add('selected');
                else item.classList.remove('selected');
            });
        }

        // 🔵 BOTÓN AZUL: Desplegar / Ocultar Lista
        function togglePlaylist() {
            const panel = document.getElementById('playlist-panel');
            panel.classList.toggle('active');
        }

        // Un Clic: Selecciona la canción
        function seleccionarItem(index) {
            pistaSeleccionada = index;
            actualizarPantalla();
        }

        // Doble Clic en la lista: Reproduce inmediatamente la canción desde YouTube
        function reproducirPistaDirecta(index) {
            pistaSeleccionada = index;
            pistaCargadaIndex = index;
            actualizarPantalla();
            if (player && player.loadVideoById) {
                player.loadVideoById(playlist[index].videoId);
            }
        }

        // 🟢 BOTÓN VERDE: Reproducir
        function reproducirAudio() {
            if (!player) return;

            if (pistaCargadaIndex !== pistaSeleccionada) {
                reproducirPistaDirecta(pistaSeleccionada);
            } else {
                player.playVideo();
            }
        }

        // 🔴 BOTÓN ROJO: Pausar
        function pausarAudio() {
            if (player && player.pauseVideo) {
                player.pauseVideo();
                vinyl.classList.remove('playing');
            }
        }

        // Precarga fluida de la fotografía en tiempo real del satélite GOES-16 (NOAA)
        async function actualizarFondoGOES() {
            let urlImagen = `https://cdn.star.nesdis.noaa.gov/GOES16/ABI/FD/GEOCOLOR/1808x1808.jpg?t=${Date.now()}`;

            try {
                const res = await fetch('https://orbita-sonora.onrender.com/api/goes');
                if (res.ok) {
                    const data = await res.json();
                    urlImagen = data.image_url;
                }
            } catch (e) {
                // Fallback local en caso de que Render esté en reposo
            }

            const imgEnMemoria = new Image();
            imgEnMemoria.src = urlImagen;

            imgEnMemoria.onload = () => {
                document.body.style.backgroundImage = `radial-gradient(circle at center, rgba(10, 15, 30, 0.25) 0%, rgba(3, 5, 10, 0.88) 100%), url('${urlImagen}')`;
                const horaActual = new Date().toLocaleTimeString();
                document.getElementById('goes-timer').innerText = `🛰️ GOES-16 Suramérica (${horaActual})`;
            };
        }

        actualizarFondoGOES();
        setInterval(actualizarFondoGOES, 600000);
    </script>
</body>
</html>
