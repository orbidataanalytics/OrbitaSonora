<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órbita Sonora | ORBIDATA</title>
    <!-- Fuentes: Orbitron (Futurista), Pacifico (Retro Jukebox), Poppins (Texto) -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            background-color: #03050a;
            /* Fondo satelital GOES-16 GeoColor por defecto */
            background-image: radial-gradient(circle at center, rgba(10, 15, 30, 0.2) 0%, rgba(3, 5, 10, 0.85) 100%),
                        url('https://cdn.star.nesdis.noaa.gov/GOES16/ABI/FD/GEOCOLOR/1808x1808.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
            transition: background-image 1s ease-in-out;
        }

        /* --- LOGO SUPERIOR: ORBIDATA --- */
        header {
            width: 100%;
            padding: 25px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .orbidata-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.8), 0 0 25px rgba(0, 240, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(10, 15, 30, 0.65);
            padding: 8px 24px;
            border-radius: 50px;
            border: 1px solid rgba(0, 240, 255, 0.4);
            backdrop-filter: blur(12px);
        }

        .orbidata-logo span {
            color: #00f0ff;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: 10px 0 40px;
            z-index: 5;
            width: 100%;
            max-width: 900px;
        }

        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(180deg, #ffffff 0%, #a5f3fc 50%, #00d8f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 216, 246, 0.6);
            margin-bottom: 25px;
        }

        /* --- ROCOLA VINTAGE (Jukebox CSS) --- */
        .jukebox-container {
            position: relative;
            width: 320px;
            height: 510px;
            background: linear-gradient(145deg, rgba(43, 9, 56, 0.95), rgba(18, 3, 28, 0.95));
            border-radius: 160px 160px 20px 20px;
            border: 6px solid #ffd700;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.4), 
                        0 0 60px rgba(0, 240, 255, 0.25),
                        inset 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 25px;
            backdrop-filter: blur(8px);
            transition: transform 0.3s ease;
        }

        .jukebox-container:hover {
            transform: scale(1.02);
        }

        /* Arco Neón Exterior Animado */
        .jukebox-arch {
            position: absolute;
            top: 10px;
            width: 280px;
            height: 140px;
            border-radius: 140px 140px 0 0;
            border: 4px solid #ff334b;
            box-shadow: 0 0 15px #ff334b, inset 0 0 15px #ff334b;
            animation: neonGlow 2.5s infinite alternate;
        }

        @keyframes neonGlow {
            0% { box-shadow: 0 0 12px #ff334b, inset 0 0 12px #ff334b; border-color: #ff334b; }
            50% { box-shadow: 0 0 20px #00e676, inset 0 0 20px #00e676; border-color: #00e676; }
            100% { box-shadow: 0 0 25px #00b0ff, inset 0 0 25px #00b0ff; border-color: #00b0ff; }
        }

        /* Ventana del Vinilo */
        .jukebox-window {
            width: 220px;
            height: 150px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 110px 110px 15px 15px;
            border: 3px solid #ffd700;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Disco de Vinilo Giratorio */
        .vinyl-record {
            width: 115px;
            height: 115px;
            background: radial-gradient(circle, #333 15%, #111 16%, #111 30%, #222 31%, #111 45%, #ffd700 46%, #ff334b 100%);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            animation: spin 4s linear infinite;
            animation-play-state: paused;
        }

        .vinyl-record.playing {
            animation-play-state: running;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .vinyl-center {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #ffffff;
            border-radius: 50%;
        }

        /* Pantalla digital de la Rocola */
        .jukebox-display {
            width: 250px;
            min-height: 48px;
            background: #0d1b2a;
            border: 2px solid #00f0ff;
            border-radius: 8px;
            margin-top: 15px;
            padding: 8px 12px;
            font-family: 'Orbitron', monospace;
            font-size: 0.72rem;
            color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            text-shadow: 0 0 5px #00f0ff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.3;
        }

        /* Rejilla de Altavoz */
        .jukebox-speaker {
            width: 240px;
            height: 120px;
            margin-top: 12px;
            background: repeating-linear-gradient(
                0deg,
                #1a1a2e,
                #1a1a2e 4px,
                #ffd700 5px,
                #1a1a2e 6px
            );
            border-radius: 10px;
            border: 3px solid #ffd700;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .jukebox-title-badge {
            font-family: 'Pacifico', cursive;
            font-size: 1.4rem;
            color: #ffd700;
            text-shadow: 2px 2px 4px #000;
            background: rgba(0,0,0,0.75);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid #ffd700;
        }

        /* --- BOTONES RETRO (ROJO, VERDE, AZUL) --- */
        .jukebox-buttons {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .btn-retro {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        /* 🔴 Botón 1: Rojo (Play / Pause) */
        .btn-retro:nth-child(1) {
            background: radial-gradient(circle at 30% 30%, #ff5252, #c62828);
            box-shadow: 0 0 12px #ff5252;
        }

        /* 🟢 Botón 2: Verde (Conectar API) */
        .btn-retro:nth-child(2) {
            background: radial-gradient(circle at 30% 30%, #69f0ae, #2e7d32);
            box-shadow: 0 0 12px #69f0ae;
        }

        /* 🔵 Botón 3: Azul (Siguiente Pista) */
        .btn-retro:nth-child(3) {
            background: radial-gradient(circle at 30% 30%, #40c4ff, #1565c0);
            box-shadow: 0 0 12px #40c4ff;
        }

        .btn-retro:hover {
            transform: scale(1.12);
        }

        .btn-retro:active {
            transform: scale(0.92);
        }

        /* --- LOGO NASA FIJO (Abajo Izquierda) --- */
        .nasa-fixed-logo {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(11, 19, 43, 0.85);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .nasa-fixed-logo:hover {
            transform: translateY(-3px);
        }

        .nasa-fixed-logo img {
            width: 38px;
            height: auto;
        }

        .nasa-fixed-logo span {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #e2e8f0;
        }

        /* Indicador Satelital GOES-16 (Abajo Derecha) */
        .goes-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(11, 19, 43, 0.85);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            font-size: 0.72rem;
            color: #a5f3fc;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 600px) {
            .main-title { font-size: 2.2rem; }
            .jukebox-container { scale: 0.88; }
            .goes-indicator { display: none; }
        }
    </style>
</head>
<body>

    <!-- 1. Logo Superior ORBIDATA -->
    <header>
        <div class="orbidata-logo">
            <span>ORBI</span>DATA
        </div>
    </header>

    <!-- 2. Contenido Principal: Título y Rocola -->
    <main>
        <h1 class="main-title">Órbita Sonora</h1>

        <div class="jukebox-container">
            <div class="jukebox-arch"></div>
            
            <div class="jukebox-window">
                <div class="vinyl-record" id="vinyl"></div>
                <div class="vinyl-center"></div>
            </div>

            <div class="jukebox-display" id="api-status">
                🔴 Presiona Rojo para iniciar sonido espacial
            </div>

            <div class="jukebox-speaker">
                <span class="jukebox-title-badge">Rock & Space</span>
            </div>

            <!-- Botones interactivos en orden RGB (Rojo, Verde, Azul) -->
            <div class="jukebox-buttons">
                <button class="btn-retro" onclick="togglePlay()" title="🔴 Rojo: Reproducir / Pausar">▶</button>
                <button class="btn-retro" onclick="conectarAPI()" title="🟢 Verde: Conectar FastAPI / NASA Data">📡</button>
                <button class="btn-retro" onclick="siguientePista()" title="🔵 Azul: Siguiente Pista">⏭</button>
            </div>
        </div>
    </main>

    <!-- 3. Logo NASA (Abajo Izquierda) -->
    <div class="nasa-fixed-logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e5/NASA_logo.svg" alt="NASA Logo">
        <span>GOES-16 & NASA Open APIs</span>
    </div>

    <!-- Indicador Satelital NOAA GOES-East (Abajo Derecha) -->
    <div class="goes-indicator" id="goes-timer">
        🛰️ GOES-16 (Suramérica en vivo)
    </div>

    <!-- Reproductor HTML5 de Audio -->
    <audio id="audio-player" preload="auto" loop></audio>

    <script>
        const playlist = [
            {
                titulo: "Pista 01: Plasma Waves (Voyager 1 - NASA)",
                url: "https://ia800301.us.archive.org/6/items/NASA_Space_Sounds/Voyager_Plasma_Waves.mp3"
            },
            {
                titulo: "Pista 02: Earth Atmosphere Soundwaves",
                url: "https://ia800301.us.archive.org/6/items/NASA_Space_Sounds/Kepler_Star_KIC11771022.mp3"
            },
            {
                titulo: "Pista 03: Jupiter Radio Waves (Galileo)",
                url: "https://ia800301.us.archive.org/6/items/NASA_Space_Sounds/Jupiter_Ganymede_Sounds.mp3"
            }
        ];

        let pistaActualIndex = 0;
        const audio = document.getElementById('audio-player');
        const vinyl = document.getElementById('vinyl');
        const display = document.getElementById('api-status');

        audio.src = playlist[pistaActualIndex].url;

        // --- SISTEMA DE ACTUALIZACIÓN DEL SATÉLITE GOES-16 (NOAA) ---
        function actualizarFondoGOES() {
            const timestamp = new Date().getTime();
            // URL oficial del satélite GOES-16 (GeoColor Full Disk centrado sobre Suramérica y América)
            const urlGOES = `https://cdn.star.nesdis.noaa.gov/GOES16/ABI/FD/GEOCOLOR/1808x1808.jpg?t=${timestamp}`;
            
            // Actualiza la imagen de fondo dinámicamente
            document.body.style.backgroundImage = `radial-gradient(circle at center, rgba(10, 15, 30, 0.2) 0%, rgba(3, 5, 10, 0.85) 100%), url('${urlGOES}')`;
            
            const horaActual = new Date().toLocaleTimeString();
            document.getElementById('goes-timer').innerText = `🛰️ GOES-16 Suramérica (${horaActual})`;
        }

        // Cargar primera vez y programar refresco automático cada 10 minutos (600,000 ms)
        actualizarFondoGOES();
        setInterval(actualizarFondoGOES, 600000);

        // 🔴 Botón Rojo: Reproducir / Pausar
        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    vinyl.classList.add('playing');
                    display.innerText = "▶ " + playlist[pistaActualIndex].titulo;
                }).catch(() => {
                    display.innerText = "⚠️ Haz clic en 🔴 para autorizar el audio";
                });
            } else {
                audio.pause();
                vinyl.classList.remove('playing');
                display.innerText = "⏸ Pausado: " + playlist[pistaActualIndex].titulo;
            }
        }

        // 🔵 Botón Azul: Siguiente Pista
        function siguientePista() {
            pistaActualIndex = (pistaActualIndex + 1) % playlist.length;
            audio.src = playlist[pistaActualIndex].url;
            display.innerText = "🔄 Cargando: " + playlist[pistaActualIndex].titulo;
            
            audio.play().then(() => {
                vinyl.classList.add('playing');
                display.innerText = "▶ " + playlist[pistaActualIndex].titulo;
            }).catch(() => {
                vinyl.classList.remove('playing');
            });
        }

        // 🟢 Botón Verde: Conectar con FastAPI o Fallback a NASA APOD
        async function conectarAPI() {
            display.innerText = "⚡ Conectando a datos orbitales...";
            
            const RENDER_URL = 'https://orbita-sonora.onrender.com/api/datos';

            try {
                const response = await fetch(RENDER_URL, { method: 'GET' });
                if (!response.ok) throw new Error("Render offline");
                
                const data = await response.json();
                display.innerText = `📡 Render: ${data.planeta} | Estado: ${data.estado}`;
            } catch (error) {
                try {
                    const nasaRes = await fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY');
                    const nasaData = await nasaRes.json();
                    display.innerText = `🌌 NASA APOD: ${nasaData.title.substring(0, 30)}...`;
                } catch (nasaErr) {
                    display.innerText = "📡 GOES-16: Suramérica Transmitiendo";
                }
            }
        }
    </script>
</body>
</html>
